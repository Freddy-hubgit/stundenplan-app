name: Build Apps

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Test update detection
        run: node tests/update-service.cjs
      - name: Test desktop recovery
        run: node tests/desktop-update.cjs
      - name: Test native notifications
        run: node tests/native-notifications.cjs
      - name: Test program updater
        run: node tests/program-updater.cjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assets = @(Get-ChildItem release/*.exe | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw "Installer und portable EXE werden benötigt." }
          if (!(Test-Path release/latest.yml)) { throw "Update-Metadaten fehlen." }
          $metadata = Get-Content release/latest.yml -Raw
          if ($metadata -notmatch '(?m)^path: (.+)\r?$') { throw "Installerpfad fehlt in latest.yml." }
          $installer = $Matches[1].Trim()
          if (!(Test-Path (Join-Path release $installer))) { throw "Installername stimmt nicht mit Update-Metadaten überein." }
          if ($installer -notmatch '^[A-Za-z0-9._-]+$') { throw "Installername muss für GitHub-Downloads unverändert bleiben." }
          $assets += @(Get-ChildItem release/*.blockmap | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path release/latest.yml).Path
          gh release create "v$version" @assets --target "$env:GITHUB_SHA" --title "Stundenplan App $version" --notes-file .github/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht veröffentlicht werden." }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - run: npm ci --legacy-peer-deps
      - run: npm run cap:sync
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
