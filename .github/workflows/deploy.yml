name: Deploy Angular

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install --legacy-peer-deps

      - run: npx ng build --configuration production --base-href /stundenplan-11bguti/

      - name: Write version.json for app updates
        run: |
          printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/demo/version.json
          mkdir -p dist/demo/assets
          cp dist/demo/version.json dist/demo/assets/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    permissions:
      pages: write
      id-token: write

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
